services:
  buildprocure-mcp:
    image: ghcr.io/buildprocure/buildprocure_mcp_config:latest
    container_name: buildprocure-mcp
    env_file:
      - .env
    environment:
      MCP_TOOL_LOG_FILE: /app/logs/tool-execution.jsonl
    ports:
      - "3011:80"
    volumes:
      - ./logs:/app/logs
    networks:
      - app-network
    restart: always

networks:
  app-network:
    external: true

